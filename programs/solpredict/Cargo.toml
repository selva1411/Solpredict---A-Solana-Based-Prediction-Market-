[package]
name = "solpredict"
version = "0.1.0"
description = "SOLPredict — Decentralized Prediction Market on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solpredict"

[features]
default = []
test-only = []
devnet-mock = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"

[profile.release]
overflow-checks = true
opt-level = "z"
lto = "fat"
codegen-units = 1

